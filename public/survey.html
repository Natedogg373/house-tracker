<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Survey · House Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/favicon.svg" alt="" />
        <span>House Tracker</span>
      </a>
      <button type="button" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>
      <nav id="site-nav" class="nav" aria-label="Primary">
        <a href="/">House Details</a>
        <a href="/map">Map</a>
        <a href="/rankings">Rankings</a>
        <a href="/survey" aria-current="page">Survey</a>
        <a href="/graveyard">Graveyard</a>
        <a href="/add">Add house</a>
        <a href="/about">About</a>
      </nav>
    </header>

    <main>
      <section class="panel survey-intro">
        <div class="survey-intro-row">
          <div>
            <h1>House Survey</h1>
            <p class="lede">
              Build a shared checklist for visits. Answers are saved per house so you can compare
              listings and keep notes from walkthroughs.
            </p>
          </div>
          <button type="button" id="add-question" class="survey-add" aria-label="Add question">+</button>
        </div>
        <p id="save-status" class="banner" hidden></p>
      </section>

      <section id="empty" class="panel empty">
        <h2>No questions yet</h2>
        <p>Tap + to add the first survey question.</p>
      </section>

      <ol id="question-list" class="survey-question-list" aria-label="Survey questions" hidden></ol>
    </main>

    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/survey.js"></script>
  </body>
</html>
