<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add a house · House Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/favicon.svg" alt="" />
        <span>House Tracker</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="/">Dashboard</a>
        <a href="/add" aria-current="page">Add house</a>
      </nav>
    </header>

    <main>
      <section class="panel">
        <h1>Add a house</h1>
        <p class="lede">
          Paste a Zillow listing URL or type a street address. We’ll send it to House Tracker, which looks the
          home up on Zillow in a browser — that’s slow, so expect a few minutes before it shows on the dashboard.
        </p>

        <form id="add-form" class="form-stack">
          <label class="field" for="house-input">
            Zillow link or street address
            <input
              id="house-input"
              name="input"
              type="text"
              autocomplete="off"
              placeholder="https://www.zillow.com/homedetails/… or 9223 Seagrove Dr, Dallas, TX"
              required
            />
          </label>
          <div class="actions">
            <button id="submit" type="submit">Send to House Tracker</button>
            <a class="button-link" href="/">Back to dashboard</a>
          </div>
        </form>

        <p id="result" class="banner" hidden></p>
      </section>
    </main>

    <script type="module" src="/js/add.js"></script>
  </body>
</html>
