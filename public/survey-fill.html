<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fill survey · House Tracker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var next = new URLSearchParams();
        var house = params.get("house");
        if (house) next.set("house", house);
        var query = next.toString();
        window.location.replace(query ? "/survey?" + query : "/survey");
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/survey" />
  </head>
  <body>
    <p>Redirecting to <a href="/survey">Survey</a>…</p>
  </body>
</html>
