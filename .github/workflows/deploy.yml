name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      # Nightly DB snapshots must not redeploy Coolify.
      - "data/backup/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Also honor [skip ci] / [ci skip] in the commit subject (backup workflow).
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') && !contains(github.event.head_commit.message || '', '[ci skip]') }}
    steps:
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Coolify deploy
        env:
          TOKEN: ${{ secrets.COOLIFY_GH_TOKEN }}
        run: |
          curl -fsS -X POST --max-time 60 \
            -H "Authorization: Bearer $TOKEN" \
            "http://100.74.201.123:8000/api/v1/deploy?uuid=li87awd6s5qjttyt2icjxqiw&force=false"
